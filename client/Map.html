<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>World Map - World Countries</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let map;
        let markerLayer;
        let countries = [];
        let displayedCountries = [];

        $(document).ready(function () {
            buildMenu("map");

            $("#searchBTN").click(filterMapFunc);
            $("#clearBTN").click(clearFiltersFunc);

            $("#searchTB").keyup(function (event) {
                if (event.key == "Enter") {
                    filterMapFunc();
                }
            });

            initializeMap();
            loadCountriesFunc();
        });


        // Initialize the Leaflet world map.
        function initializeMap() {
            map = L.map("map").setView([20, 0], 2);

            L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
                    maxZoom: 18,
                    attribution:
                        '&copy; <a href="https://www.openstreetmap.org/copyright">' +
                        'OpenStreetMap contributors</a>'
                }
            ).addTo(map);

            markerLayer = L.layerGroup().addTo(map);
        }


        // Load countries from our server.
        function loadCountriesFunc() {
            let url = countriesApi +
                "?search=" +
                "&region=" +
                "&language=" +
                "&currency=" +
                "&sortBy=name" +
                "&dir=asc";

            ajaxCall("GET", url, null, loadCountriesSuccess, error);
        }

        function loadCountriesSuccess(data) {
            countries = data;

            fillRegionsDropdown();
            displayMarkers(countries);
        }


        // Create the regions dropdown from the loaded countries.
        function fillRegionsDropdown() {
            let regions = [];

            for (let i = 0; i < countries.length; i++) {
                let region = countries[i].region;

                if (region != null &&
                    region.trim() != "" &&
                    !regions.includes(region)) {

                    regions.push(region);
                }
            }

            regions.sort();

            let str = `<option value="">All regions</option>`;

            for (let i = 0; i < regions.length; i++) {
                str += `
                            <option value="${safeText(regions[i])}">
                                ${safeText(regions[i])}
                            </option>
                        `;
            }

            $("#regionDD").html(str);
        }


        // Display markers for the supplied countries.
        function displayMarkers(countriesToDisplay) {
            markerLayer.clearLayers();
            displayedCountries = [];

            let markerLocations = [];

            for (let i = 0; i < countriesToDisplay.length; i++) {
                let country = countriesToDisplay[i];

                let latitude = Number(country.lat);
                let longitude = Number(country.lng);

                if (isNaN(latitude) || isNaN(longitude)) {
                    continue;
                }

                // A value of 0,0 usually means coordinates were unavailable.
                if (latitude == 0 && longitude == 0) {
                    continue;
                }

                let marker = createCountryMarker(
                    country,
                    latitude,
                    longitude
                );

                marker.addTo(markerLayer);

                displayedCountries.push(country);
                markerLocations.push([latitude, longitude]);
            }

            $("#countriesCountPH").text(
                displayedCountries.length + " countries shown on the map"
            );

            if (markerLocations.length == 1) {
                map.setView(markerLocations[0], 5);
            }
            else if (markerLocations.length > 1) {
                map.fitBounds(markerLocations, {
                    padding: [25, 25],
                    maxZoom: 4
                });
            }
        }


        // Create one marker and popup.
        function createCountryMarker(country, latitude, longitude) {
            let marker = L.circleMarker(
                [latitude, longitude],
                {
                    radius: 7,
                    weight: 2,
                    fillOpacity: 0.8
                }
            );

            let flag = country.flagPngUrl;

            if (flag == null || flag == "") {
                flag = country.flagUrl;
            }

            let popup = `
                        <div class="country-popup">
                            <img src="${safeText(flag)}"
                                 alt="Flag of ${safeText(country.name)}" />

                            <h3>${safeText(country.name)}</h3>

                            <p>
                                <strong>Capital:</strong>
                                ${safeText(country.capital)}
                            </p>

                            <p>
                                <strong>Region:</strong>
                                ${safeText(country.region)}
                            </p>

                            <p>
                                <strong>Population:</strong>
                                ${formatNumber(country.population)}
                            </p>

                            <a class="map-details-link"
                               href="country.html?id=${country.countryId}">
                                View details
                            </a>
                        </div>
                    `;

            marker.bindPopup(popup);

            return marker;
        }


        // Search and filter the markers.
        function filterMapFunc() {
            let search = $("#searchTB").val().trim().toLowerCase();
            let selectedRegion = $("#regionDD").val();

            let filteredCountries = [];

            for (let i = 0; i < countries.length; i++) {
                let country = countries[i];

                let name = "";

                if (country.name != null) {
                    name = country.name.toLowerCase();
                }

                let capital = "";

                if (country.capital != null) {
                    capital = country.capital.toLowerCase();
                }

                let matchesSearch =
                    search == "" ||
                    name.includes(search) ||
                    capital.includes(search);

                let matchesRegion =
                    selectedRegion == "" ||
                    country.region == selectedRegion;

                if (matchesSearch && matchesRegion) {
                    filteredCountries.push(country);
                }
            }

            displayMarkers(filteredCountries);

            if (filteredCountries.length == 0) {
                swal(
                    "No countries found",
                    "No country matches the selected filters",
                    "warning"
                );
            }
        }


        // Clear the search and region selection.
        function clearFiltersFunc() {
            $("#searchTB").val("");
            $("#regionDD").val("");

            displayMarkers(countries);
        }
    </script>

    <style>
        .map-filters {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

            .map-filters input[type="text"],
            .map-filters select {
                padding: 9px;
                border: 1px solid #cfd8e3;
                border-radius: 6px;
            }

        #map {
            width: 100%;
            height: 650px;
            border-radius: 8px;
            border: 1px solid #cfd8e3;
            z-index: 1;
        }

        #countriesCountPH {
            margin: 10px 0;
            color: #5c6773;
        }

        .country-popup {
            min-width: 180px;
            text-align: center;
        }

            .country-popup img {
                width: 110px;
                max-height: 75px;
                object-fit: contain;
                border: 1px solid #ddd;
            }

            .country-popup h3 {
                margin: 8px 0;
            }

            .country-popup p {
                margin: 5px 0;
                text-align: left;
            }

        .map-details-link {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 12px;
            color: white;
            background: #4169a1;
            text-decoration: none;
            border-radius: 5px;
        }

            .map-details-link:hover {
                background: #315581;
            }
    </style>
</head>

<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>World Countries Map</h1>

        <div class="card-box">
            <div class="map-filters">
                <input type="text"
                       id="searchTB"
                       placeholder="Search by country or capital" />

                <select id="regionDD">
                    <option value="">All regions</option>
                </select>

                <input type="button"
                       id="searchBTN"
                       value="Search" />

                <input type="button"
                       id="clearBTN"
                       value="Clear" />
            </div>

            <div id="countriesCountPH">
                Loading countries...
            </div>
        </div>

        <div id="map"></div>
    </div>
</body>
</html>
