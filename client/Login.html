<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Login - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        $(document).ready(function () {
            // A user who is already logged in has nothing to do here
            if (isLoggedIn()) {
                window.location.href = "index.html";
                return;
            }

            $("#loginForm").submit(loginFunc);

            $("#registerLink").click(function () {
                window.location.href = "Register.html";
            });
        });

        function loginFunc() {
            let user = {
                userId: 0,
                fullName: "",
                email: $("#emailTB").val().trim().toLowerCase(),
                password: $("#passTB").val(),
                passwordHash: "",
                role: "User",
                isLocked: false,
                canShare: true
            };

            $("#msgPH").html("");

            ajaxCall("POST", usersApi + "/Login", user, loginSuccess, loginError);

            // stops the form from reloading the page
            return false;
        }

        function loginSuccess(user) {
            saveLoggedUser(user);

            swal("Welcome", "Hello " + user.fullName, "success");

            window.location.href = "index.html";
        }

        function loginError(err) {
            console.log(err);

            // 401 = wrong details, 403 = the account was locked by an admin
            if (err.status == 403) {
                $("#msgPH").html("Your account is locked. Please contact the administrator.");
            }
            else {
                $("#msgPH").html("Wrong email or password");
            }
        }
    </script>
</head>

<body>
    <div class="page">
        <div id="menuPH"></div>

        <div class="form-box">
            <h1>Login</h1>

            <form id="loginForm">
                <input id="emailTB"
                       type="email"
                       placeholder="Email"
                       required />

                <input id="passTB"
                       type="password"
                       placeholder="Password"
                       required
                       minlength="6" />

                <input type="submit" value="Login" />
            </form>

            <p id="msgPH" class="error"></p>

            <p>
                New user?
                <a href="#" id="registerLink">Register here</a>
            </p>
        </div>
    </div>

    <script>
        buildMenu("");
    </script>
</body>
</html>
