<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Admin - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.min.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let usersTbl = null;
        let statsPollingId = null;

        const STATS_POLLING_SECONDS = 15;

        $(document).ready(function () {
            if (!requireAdmin()) {
                return;
            }

            buildMenu("admin");

            $("#importBTN").click(importCountriesFunc);
            $("#refreshBTN").click(loadUsersFunc);

            loadStatsFunc();
            loadUsersFunc();

            // the statistics refresh by themselves
            statsPollingId = setInterval(loadStatsFunc, STATS_POLLING_SECONDS * 1000);
        });

        $(window).on("beforeunload", function () {
            if (statsPollingId != null) {
                clearInterval(statsPollingId);
            }
        });

        // Statistics
        function loadStatsFunc() {
            ajaxCall("GET", adminApi + "/Stats", null, loadStatsSuccess, statsError);
        }

        function loadStatsSuccess(stats) {
            let boxes = [
                ["Logins today", stats.dailyLogins],
                ["Countries imported", stats.countriesImported],
                ["Countries saved in lists", stats.countriesSaved],
                ["Shares created", stats.sharesCreated]
            ];

            let str = "";

            for (let i = 0; i < boxes.length; i++) {
                str += `
                    <div class="stat-box">
                        <div class="stat-number">${formatNumber(boxes[i][1])}</div>
                        <div class="stat-label">${boxes[i][0]}</div>
                    </div>
                `;
            }

            $("#statsPH").html(str);

            let now = new Date();
            $("#updatedPH").html("Updated at " + now.toLocaleTimeString());
        }

        function statsError(err) {
            console.log(err);
            $("#updatedPH").html("Could not load the statistics");
        }

        // Users

        function loadUsersFunc() {
            ajaxCall("GET", adminApi + "/Users", null, loadUsersSuccess, error);
        }

        function loadUsersSuccess(users) {
            if (usersTbl != null) {
                usersTbl.destroy();
                $("#usersTable tbody").empty();
            }

            usersTbl = $("#usersTable").DataTable({
                data: users,
                pageLength: 10,
                columns: [
                    { data: "userId" },
                    { data: "fullName" },
                    { data: "email" },
                    { data: "role" },
                    {
                        data: "isLocked",
                        render: function (data) {
                            return data ? "Locked" : "Active";
                        }
                    },
                    {
                        data: "canShare",
                        render: function (data) {
                            return data ? "Yes" : "Blocked";
                        }
                    },
                    {
                        data: null,
                        render: function (data, type, row) {
                            let lockLabel = row.isLocked ? "Unlock" : "Lock";
                            let shareLabel = row.canShare ? "Block sharing" : "Allow sharing";

                            return `
                                <button class="lockBTN"
                                        data-userid="${row.userId}"
                                        data-value="${!row.isLocked}">
                                    ${lockLabel}
                                </button>

                                <button class="shareBTN"
                                        data-userid="${row.userId}"
                                        data-value="${!row.canShare}">
                                    ${shareLabel}
                                </button>
                            `;
                        }
                    }
                ]
            });

            buttonEvents();
        }
        function buttonEvents() {
            $(document).off("click", ".lockBTN");
            $(document).off("click", ".shareBTN");

            $(document).on("click", ".lockBTN", function () {
                let userId = this.getAttribute("data-userid");
                let value = (this.getAttribute("data-value") == "true");

                setLockedFunc(userId, value);
            });

            $(document).on("click", ".shareBTN", function () {
                let userId = this.getAttribute("data-userid");
                let value = (this.getAttribute("data-value") == "true");

                setCanShareFunc(userId, value);
            });
        }

        function setLockedFunc(userId, isLocked) {
            let request = { isLocked: isLocked };
            ajaxCall("PUT", adminApi + "/Lock/" + userId, request,
                loadUsersFunc, error);
        }
        function setCanShareFunc(userId, canShare) {
            let request = { canShare: canShare };

            ajaxCall("PUT", adminApi + "/CanShare/" + userId, request,
                loadUsersFunc, error);
        }


        // Import countries from the API

        function importCountriesFunc() {
            $("#importBTN").prop("disabled", true);
            $("#importBTN").val("Importing, please wait...");

            ajaxCall("POST", countriesApi + "/Import", null,
                importSuccess, importError);
        }

        function importSuccess(result) {
            $("#importBTN").prop("disabled", false);
            $("#importBTN").val("Import countries");

            swal("Done", "The import finished successfully", "success");

            loadStatsFunc();
        }

        function importError(err) {
            $("#importBTN").prop("disabled", false);
            $("#importBTN").val("Import countries");

            error(err);
        }
</script>
</head>
<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>Administration</h1>

        <!-- ---------- statistics ---------- -->
        <div class="stats-row" id="statsPH"></div>
        <p id="updatedPH" class="share-head"></p>

        <!-- ---------- import ---------- -->
        <div class="card-box">
            <h2>Import countries</h2>
            <p>
                Pulls the country data on the server side and saves it
                into the database.
            </p>
            <input type="button" id="importBTN" value="Import countries" />
        </div>

        <!-- ---------- users ---------- -->
        <div class="card-box">
            <h2>Users</h2>

            <input type="button" id="refreshBTN" value="Refresh" />

            <table id="usersTable" class="display" style="width:100%">
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Sharing</th>
                        <th>Actions</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</body>
</html>
