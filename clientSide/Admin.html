<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Administration - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let admin = null;
        let refreshInterval = null;

        $(document).ready(function () {
            if (!requireAdmin()) {
                return;
            }

            admin = getLoggedUser();

            buildMenu("admin");

            $("#refreshBTN").click(refreshAdminPage);

            refreshAdminPage();

            // Refresh statistics and information every 15 seconds
            refreshInterval = setInterval(function () {
                refreshAdminPage();
            }, 15000);
        });

        // =====================================================
        // Refresh the complete administration page
        // =====================================================

        function refreshAdminPage() {
            loadStatisticsFunc();
            loadUsersFunc();
            loadSharesFunc();
        }

        // =====================================================
        // Statistics
        // =====================================================

        function loadStatisticsFunc() {
            let api = adminApi + "/" + admin.userId + "/Statistics";

            ajaxCall("GET", api, null,
                loadStatisticsSuccess, adminError);
        }

        function loadStatisticsSuccess(statistics) {
            $("#usersCountPH").text(statistics.usersCount);
            $("#lockedUsersCountPH").text(statistics.lockedUsersCount);
            $("#blockedSharingCountPH").text(statistics.blockedSharingCount);
            $("#countriesCountPH").text(statistics.countriesCount);
            $("#sharesCountPH").text(statistics.sharesCount);
            $("#savedCountriesCountPH").text(statistics.savedCountriesCount);
            $("#quizAttemptsCountPH").text(
                statistics.completedQuizAttemptsCount
            );

            $("#lastRefreshPH").text(
                "Last refresh: " + new Date().toLocaleTimeString()
            );
        }

        // =====================================================
        // Users
        // =====================================================

        function loadUsersFunc() {
            let api = adminApi + "/" + admin.userId + "/Users";

            ajaxCall("GET", api, null,
                loadUsersSuccess, adminError);
        }

        function loadUsersSuccess(users) {
            if (users.length == 0) {
                $("#usersPH").html("<p>No users were found.</p>");
                return;
            }

            let str = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Full name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Login status</th>
                                    <th>Sharing status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

            for (let i = 0; i < users.length; i++) {
                let user = users[i];

                let lockedText = user.isLocked ? "Locked" : "Active";
                let sharingText = user.canShare ? "Allowed" : "Blocked";

                let lockButtonText = user.isLocked ? "Unlock" : "Lock";
                let newLockValue = !user.isLocked;

                let shareButtonText = user.canShare
                    ? "Block sharing"
                    : "Allow sharing";

                let newShareValue = !user.canShare;

                let actionButtons = "";

                // The administrator should not lock or block themselves
                if (user.userId == admin.userId) {
                    actionButtons = "<span>Current administrator</span>";
                }
                else {
                    actionButtons = `
                                <button onclick="changeLockFunc(
                                    ${user.userId},
                                    ${newLockValue}
                                )">
                                    ${lockButtonText}
                                </button>

                                <button onclick="changeSharePermissionFunc(
                                    ${user.userId},
                                    ${newShareValue}
                                )">
                                    ${shareButtonText}
                                </button>
                            `;
                }

                str += `
                            <tr>
                                <td>${user.userId}</td>
                                <td>${safeText(user.fullName)}</td>
                                <td>${safeText(user.email)}</td>
                                <td>${safeText(user.role)}</td>

                                <td>
                                    <span class="${user.isLocked
                        ? "status-bad"
                        : "status-good"}">
                                        ${lockedText}
                                    </span>
                                </td>

                                <td>
                                    <span class="${user.canShare
                        ? "status-good"
                        : "status-bad"}">
                                        ${sharingText}
                                    </span>
                                </td>

                                <td class="action-cell">
                                    ${actionButtons}
                                </td>
                            </tr>
                        `;
            }

            str += `
                            </tbody>
                        </table>
                    `;

            $("#usersPH").html(str);
        }

        function changeLockFunc(userId, newValue) {
            let actionText = newValue ? "lock" : "unlock";

            swal({
                title: "Are you sure?",
                text: "Do you want to " + actionText + " this user?",
                icon: "warning",
                buttons: true,
                dangerMode: newValue
            })
                .then(function (confirmed) {
                    if (!confirmed) {
                        return;
                    }

                    let request = {
                        value: newValue
                    };

                    let api = adminApi + "/" +
                        admin.userId +
                        "/Users/" +
                        userId +
                        "/Lock";

                    ajaxCall("PUT", api, request,
                        changeLockSuccess, adminError);
                });
        }

        function changeLockSuccess(result) {
            swal("Saved", "The login permission was updated", "success");
            loadUsersFunc();
            loadStatisticsFunc();
        }

        function changeSharePermissionFunc(userId, newValue) {
            let actionText = newValue
                ? "allow this user to share"
                : "block this user from sharing";

            swal({
                title: "Change sharing permission?",
                text: "Do you want to " + actionText + "?",
                icon: "warning",
                buttons: true
            })
                .then(function (confirmed) {
                    if (!confirmed) {
                        return;
                    }

                    let request = {
                        value: newValue
                    };

                    let api = adminApi + "/" +
                        admin.userId +
                        "/Users/" +
                        userId +
                        "/Share";

                    ajaxCall("PUT", api, request,
                        changeShareSuccess, adminError);
                });
        }

        function changeShareSuccess(result) {
            swal("Saved", "The sharing permission was updated", "success");
            loadUsersFunc();
            loadStatisticsFunc();
        }

        // =====================================================
        // Shares moderation
        // =====================================================

        function loadSharesFunc() {
            ajaxCall("GET", sharesApi, null,
                loadSharesSuccess, adminError);
        }

        function loadSharesSuccess(shares) {
            if (shares.length == 0) {
                $("#sharesPH").html("<p>There are no shares.</p>");
                return;
            }

            let str = "";

            for (let i = 0; i < shares.length; i++) {
                let share = shares[i];

                str += `
                            <div class="share-card">
                                <div class="share-head">
                                    <div>
                                        <strong>${safeText(share.userName)}</strong>
                                        shared about
                                        <a href="country.html?id=${share.countryId}">
                                            ${safeText(share.countryName)}
                                        </a>
                                    </div>

                                    <span>
                                        ${formatAdminDate(share.createdAt)}
                                    </span>
                                </div>

                                <p>${safeText(share.content)}</p>

                                <button class="delete-btn"
                                        onclick="deleteShareAdminFunc(
                                            ${share.shareId}
                                        )">
                                    Delete share
                                </button>
                            </div>
                        `;
            }

            $("#sharesPH").html(str);
        }

        function deleteShareAdminFunc(shareId) {
            swal({
                title: "Delete this share?",
                text: "The administrator will permanently remove this content.",
                icon: "warning",
                buttons: true,
                dangerMode: true
            })
                .then(function (confirmed) {
                    if (!confirmed) {
                        return;
                    }

                    let api = adminApi + "/" +
                        admin.userId +
                        "/Shares/" +
                        shareId;

                    ajaxCall("DELETE", api, null,
                        deleteShareAdminSuccess, adminError);
                });
        }

        function deleteShareAdminSuccess(result) {
            swal("Deleted", "The share was removed", "success");

            loadSharesFunc();
            loadStatisticsFunc();
        }

        // =====================================================
        // Helpers
        // =====================================================

        function formatAdminDate(dateValue) {
            if (dateValue == null || dateValue == "") {
                return "";
            }

            return new Date(dateValue).toLocaleString();
        }

        function adminError(err) {
            console.log(err);

            if (err != null && err.status == 403) {
                swal(
                    "Forbidden",
                    "Administrator permission is required",
                    "error"
                );

                window.location.href = "index.html";
                return;
            }

            error(err);
        }
    </script>

    <style>
        .statistics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
        }

        .stat-card {
            background-color: white;
            border: 1px solid #d9e1ec;
            border-radius: 8px;
            padding: 18px;
            text-align: center;
        }

        .stat-number {
            display: block;
            margin-top: 8px;
            font-size: 28px;
            font-weight: bold;
            color: #1f4e79;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

            .admin-table th,
            .admin-table td {
                padding: 10px;
                border-bottom: 1px solid #d9e1ec;
                text-align: left;
                vertical-align: middle;
            }

            .admin-table th {
                background-color: #eaf0f8;
                color: #1f4e79;
            }

        .action-cell {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .status-good {
            color: green;
            font-weight: bold;
        }

        .status-bad {
            color: #c0392b;
            font-weight: bold;
        }

        .admin-section {
            margin-top: 25px;
        }

        #lastRefreshPH {
            color: #666;
            font-size: 14px;
        }

        @media screen and (max-width: 900px) {
            .admin-table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>Administration</h1>

        <div class="controls">
            <input type="button"
                   id="refreshBTN"
                   value="Refresh administration data" />

            <span id="lastRefreshPH"></span>
        </div>

        <section class="admin-section">
            <h2>System statistics</h2>

            <div class="statistics-grid">
                <div class="stat-card">
                    Registered users
                    <span class="stat-number" id="usersCountPH">0</span>
                </div>

                <div class="stat-card">
                    Locked users
                    <span class="stat-number" id="lockedUsersCountPH">0</span>
                </div>

                <div class="stat-card">
                    Sharing blocked
                    <span class="stat-number" id="blockedSharingCountPH">0</span>
                </div>

                <div class="stat-card">
                    Countries
                    <span class="stat-number" id="countriesCountPH">0</span>
                </div>

                <div class="stat-card">
                    Shares
                    <span class="stat-number" id="sharesCountPH">0</span>
                </div>

                <div class="stat-card">
                    Saved countries
                    <span class="stat-number" id="savedCountriesCountPH">0</span>
                </div>

                <div class="stat-card">
                    Completed quizzes
                    <span class="stat-number" id="quizAttemptsCountPH">0</span>
                </div>
            </div>
        </section>

        <section class="admin-section">
            <h2>User management</h2>
            <div id="usersPH"></div>
        </section>

        <section class="admin-section">
            <h2>Shares moderation</h2>
            <div id="sharesPH"></div>
        </section>
    </div>
</body>
</html>
