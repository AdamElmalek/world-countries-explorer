<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Country Details - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let countryId = 0;
        let user = null;

        $(document).ready(function () {
            buildMenu("countries");

            user = getLoggedUser();
            countryId = getQueryParam("id");

            if (countryId == null) {
                $("#detailsPH").html("<h3>No country was chosen</h3>");
                return;
            }

            $("#addShareBTN").click(addShareFunc);
            $("#backBTN").click(function () {
                window.location.href = "index.html";
            });


            // the share form is only shown to a logged-in user
            if (isLoggedIn()) {
                $("#shareFormDiv").show();
                $("#loginHintPH").hide();
            }
            else {
                $("#shareFormDiv").hide();
                $("#loginHintPH").show();
            }

            loadCountryFunc();
            loadSharesFunc();
        });


        // Country details
        function loadCountryFunc() {
            ajaxCall("GET", countriesApi + "/" + countryId, null,
                loadCountrySuccess, error);
        }

        function loadCountrySuccess(country) {
            let buttons = "";

            if (isLoggedIn()) {
                buttons = `
                    <button class="green-btn" onclick="addToListFunc('Visited')">
                        I visited
                    </button>
                    <button onclick="addToListFunc('WantToVisit')">
                        Want to visit
                    </button>
                `;
            }

            let str = `
                <div class="card-box">
                    <div class="country-details">
                        <img src="${safeText(country.flagUrl)}" width="260"
                             alt="Flag of ${safeText(country.name)}" />

                        <div>
                            <h1>${safeText(country.name)}</h1>

                            <table class="details-table">
                                <tr><td>Capital</td><td>${safeText(country.capital)}</td></tr>
                                <tr><td>Region</td><td>${safeText(country.region)}</td></tr>
                                <tr><td>Languages</td><td>${safeText(country.languages)}</td></tr>
                                <tr><td>Currencies</td><td>${safeText(country.currencies)}</td></tr>
                                <tr><td>Population</td><td>${formatNumber(country.population)}</td></tr>
                                <tr><td>Area</td><td>${formatNumber(country.area)} km²</td></tr>
                            </table>

                            ${buttons}
                        </div>
                    </div>
                </div>
            `;

            $("#detailsPH").html(str);
        }

</script>
</head >
            <body>

            </body>
</html >
