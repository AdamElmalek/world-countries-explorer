<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Shares - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>
    <script>
        let user = null;
        let allShares = [];
        let pollingId = null;
        let lastCount = 0;

        // how often the page asks the server for new shares
        const POLLING_SECONDS = 10;

        $(document).ready(function () {
            buildMenu("shares");

            user = getLoggedUser();

            $("#countryDD").change(renderShares);
            $("#textTB").on("input", renderShares);

            $("#pollingCB").change(togglePollingFunc);

            loadSharesFunc();

            // RealTime with polling: the feed refreshes by itself
            startPolling();
        });


        // Polling

        function startPolling() {
            if (pollingId != null) {
                return;
            }

            pollingId = setInterval(loadSharesFunc, POLLING_SECONDS * 1000);
            $("#pollingStatusPH").html("Live updates are on (every " + POLLING_SECONDS + " seconds)");
        }

        function stopPolling() {
            if (pollingId != null) {
                clearInterval(pollingId);
                pollingId = null;
            }

            $("#pollingStatusPH").html("Live updates are off");
        }

        function togglePollingFunc() {
            if ($("#pollingCB").is(":checked")) {
                startPolling();
            }
            else {
                stopPolling();
            }
        }

        // stop the timer when the page is closed
        $(window).on("beforeunload", function () {
            stopPolling();
        });


        // Load and show

        function loadSharesFunc() {
            ajaxCall("GET", sharesApi, null, loadSharesSuccess, pollingError);
        }

        function loadSharesSuccess(shares) {
            // tell the user when new shares arrived through polling
            if (lastCount > 0 && shares.length > lastCount) {
                let newOnes = shares.length - lastCount;
                $("#newSharesPH").html(newOnes + " new share(s) arrived");

                setTimeout(function () {
                    $("#newSharesPH").html("");
                }, 4000);
            }

            lastCount = shares.length;
            allShares = shares;

            fillCountryDropDown();
            renderShares();
        }

        // a failing poll must not spam the user with popups
        function pollingError(err) {
            console.log(err);
            $("#pollingStatusPH").html("Could not reach the server");
        }

        function fillCountryDropDown() {
            let current = $("#countryDD").val();

            let names = [];

            for (let i = 0; i < allShares.length; i++) {
                if (!names.includes(allShares[i].countryName)) {
                    names.push(allShares[i].countryName);
                }
            }

            names.sort();

            let str = "<option value=''>All countries</option>";

            for (let i = 0; i < names.length; i++) {
                str += `<option value="${names[i]}">${names[i]}</option>`;
            }

            $("#countryDD").html(str);

            if (current != null) {
                $("#countryDD").val(current);
            }
        }





</script>
</head >

            </body>
</html >
