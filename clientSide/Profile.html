<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Profile - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;

        $(document).ready(function () {
            if (!requireLogin()) {
                return;
            }

            user = getLoggedUser();

            buildMenu("");

            $("#profileForm").submit(updateProfileFunc);
            $("#passwordForm").submit(changePasswordFunc);
            $("#languageForm").submit(addLanguageFunc);
            $("#addContinentBTN").click(addContinentFunc);

            loadProfileFunc();
            loadContinentsFunc();
            loadLanguagesFunc();
        });


        // Personal details

        function loadProfileFunc() {
            ajaxCall("GET", usersApi + "/" + user.userId, null, loadProfileSuccess, error);
        }

        function loadProfileSuccess(profile) {
            $("#nameTB").val(profile.fullName);
            $("#emailTB").val(profile.email);
        }

        function updateProfileFunc() {
            let updatedUser = {
                userId: user.userId,
                fullName: $("#nameTB").val().trim(),
                email: $("#emailTB").val().trim().toLowerCase(),
                password: "",
                passwordHash: "",
                role: user.role,
                isLocked: false,
                canShare: true
            };

            ajaxCall("PUT", usersApi + "/" + user.userId, updatedUser,
                updateProfileSuccess, updateProfileError);

            return false;
        }

        function updateProfileSuccess(result) {
            // keep the menu and localStorage up to date
            user.fullName = $("#nameTB").val().trim();
            user.email = $("#emailTB").val().trim().toLowerCase();
            saveLoggedUser(user);

            buildMenu("");

            swal("Saved", "Your details were updated", "success");
        }

        function updateProfileError(err) {
            console.log(err);

            // 409 = the email belongs to another user
            if (err.status == 409) {
                swal("Email in use", "This email belongs to another user", "warning");
            }
            else {
                swal("Error", "Could not update your details", "error");
            }
        }
        // =====================================================
        // Change password
        // =====================================================

        function changePasswordFunc() {
            let request = {
                email: user.email,
                currentPassword: $("#currentPassTB").val(),
                newPassword: $("#newPassTB").val()
            };

            ajaxCall("PUT", usersApi + "/" + user.userId + "/Password", request,
                changePasswordSuccess, changePasswordError);

            return false;
        }

        function changePasswordSuccess(result) {
            $("#currentPassTB").val("");
            $("#newPassTB").val("");

            swal("Saved", "Your password was updated", "success");
        }

        function changePasswordError(err) {
            console.log(err);
            swal("Failed", "The current password is not correct", "error");
        }


        // Continent preferences

        function loadContinentsFunc() {
            ajaxCall("GET", usersApi + "/" + user.userId + "/Continents", null,
                loadContinentsSuccess, error);
        }

        function loadContinentsSuccess(continents) {
            if (continents.length == 0) {
                $("#continentsPH").html("<p>No continents were chosen yet</p>");
                return;
            }

            let str = "";

            for (let i = 0; i < continents.length; i++) {
                str += `
                    <span class="chip">
                        ${safeText(continents[i])}
                        <button onclick="removeContinentFunc('${safeText(continents[i])}')">x</button>
                    </span>
                `;
            }

            $("#continentsPH").html(str);
        }

        function addContinentFunc() {
            let request = {
                continentName: $("#continentDD").val()
            };

            ajaxCall("POST", usersApi + "/" + user.userId + "/Continents", request,
                addContinentSuccess, addContinentError);
        }

        function addContinentSuccess(result) {
            loadContinentsFunc();
        }

        function addContinentError(err) {
            console.log(err);

            if (err.status == 409) {
                swal("Already added", "This continent is already in your list", "warning");
            }
            else {
                swal("Error", "Could not add the continent", "error");
            }
        }

        function removeContinentFunc(continentName) {
            ajaxCall("DELETE",
                usersApi + "/" + user.userId + "/Continents/" + encodeURIComponent(continentName),
                null, loadContinentsFunc, error);
        }


        // Language preferences

        function loadLanguagesFunc() {
            ajaxCall("GET", usersApi + "/" + user.userId + "/Languages", null,
                loadLanguagesSuccess, error);
        }

        function loadLanguagesSuccess(languages) {
            if (languages.length == 0) {
                $("#languagesPH").html("<p>No languages were added yet</p>");
                return;
            }

            let levels = ["Beginner", "Intermediate", "Advanced", "Native"];
            let str = "";

            for (let i = 0; i < languages.length; i++) {
                let lang = languages[i];

                let options = "";

                for (let j = 0; j < levels.length; j++) {
                    let selected = (levels[j] == lang.proficiencyLevel) ? "selected" : "";
                    options += `<option ${selected}>${levels[j]}</option>`;
                }

                str += `
                    <div class="lang-row">
                        <strong>${safeText(lang.languageName)}</strong>
                        (${safeText(lang.languageCode)})

                        <select onchange="updateLanguageFunc('${safeText(lang.languageCode)}', this.value)">
                            ${options}
                        </select>

                        <button class="delete-btn"
                                onclick="removeLanguageFunc('${safeText(lang.languageCode)}')">
                            Remove
                        </button>
                    </div>
                `;
            }

            $("#languagesPH").html(str);
        }

        function addLanguageFunc() {
            let language = {
                languageCode: $("#langCodeTB").val().trim().toLowerCase(),
                languageName: $("#langNameTB").val().trim(),
                proficiencyLevel: $("#langLevelDD").val()
            };

            ajaxCall("POST", usersApi + "/" + user.userId + "/Languages", language,
                addLanguageSuccess, addLanguageError);

            return false;
        }

        function addLanguageSuccess(result) {
            $("#langCodeTB").val("");
            $("#langNameTB").val("");

            loadLanguagesFunc();
        }

        function addLanguageError(err) {
            console.log(err);

            if (err.status == 409) {
                swal("Already added", "This language is already in your list", "warning");
            }
            else {
                swal("Error", "Could not add the language", "error");
            }
        }

        function updateLanguageFunc(languageCode, proficiencyLevel) {
            let request = {
                proficiencyLevel: proficiencyLevel
            };

            ajaxCall("PUT",
                usersApi + "/" + user.userId + "/Languages/" + languageCode,
                request, updateLanguageSuccess, error);
        }

        function updateLanguageSuccess(result) {
            swal("Saved", "The level was updated", "success");
        }

        function removeLanguageFunc(languageCode) {
            ajaxCall("DELETE",
                usersApi + "/" + user.userId + "/Languages/" + languageCode,
                null, loadLanguagesFunc, error);
        }


        </script>
</head>
<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>My Profile</h1>

        <!-- ---------- personal details ---------- -->
        <div class="card-box">
            <h2>Personal details</h2>

            <form id="profileForm">
                <input id="nameTB"
                       type="text"
                       placeholder="Full name"
                       required
                       minlength="2"
                       maxlength="100" />

                <input id="emailTB"
                       type="email"
                       placeholder="Email"
                       required
                       maxlength="255" />

                <input type="submit" value="Save changes" />
            </form>
        </div>

        <!-- ---------- password ---------- -->
        <div class="card-box">
            <h2>Change password</h2>

            <form id="passwordForm">
                <input id="currentPassTB"
                       type="password"
                       placeholder="Current password"
                       required />

                <input id="newPassTB"
                       type="password"
                       placeholder="New password"
                       required
                       minlength="6"
                       pattern="(?=.*[A-Z])(?=.*[0-9]).{6,}"
                       title="At least 6 characters, one capital letter and one digit" />

                <input type="submit" value="Update password" />
            </form>
        </div>






    </div>

</body>
</html>
