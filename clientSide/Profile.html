<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Profile - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;

        $(document).ready(function () {
            if (!requireLogin()) {
                return;
            }

            user = getLoggedUser();

            buildMenu("");

            $("#profileForm").submit(updateProfileFunc);
            $("#passwordForm").submit(changePasswordFunc);
            $("#languageForm").submit(addLanguageFunc);
            $("#addContinentBTN").click(addContinentFunc);

            loadProfileFunc();
            loadContinentsFunc();
            loadLanguagesFunc();
        });


        // Personal details

        function loadProfileFunc() {
            ajaxCall("GET", usersApi + "/" + user.userId, null, loadProfileSuccess, error);
        }

        function loadProfileSuccess(profile) {
            $("#nameTB").val(profile.fullName);
            $("#emailTB").val(profile.email);
        }

        function updateProfileFunc() {
            let updatedUser = {
                userId: user.userId,
                fullName: $("#nameTB").val().trim(),
                email: $("#emailTB").val().trim().toLowerCase(),
                password: "",
                passwordHash: "",
                role: user.role,
                isLocked: false,
                canShare: true
            };

            ajaxCall("PUT", usersApi + "/" + user.userId, updatedUser,
                updateProfileSuccess, updateProfileError);

            return false;
        }

        function updateProfileSuccess(result) {
            // keep the menu and localStorage up to date
            user.fullName = $("#nameTB").val().trim();
            user.email = $("#emailTB").val().trim().toLowerCase();
            saveLoggedUser(user);

            buildMenu("");

            swal("Saved", "Your details were updated", "success");
        }

        function updateProfileError(err) {
            console.log(err);

            // 409 = the email belongs to another user
            if (err.status == 409) {
                swal("Email in use", "This email belongs to another user", "warning");
            }
            else {
                swal("Error", "Could not update your details", "error");
            }
        }
        // =====================================================
        // Change password
        // =====================================================

        function changePasswordFunc() {
            let request = {
                email: user.email,
                currentPassword: $("#currentPassTB").val(),
                newPassword: $("#newPassTB").val()
            };

            ajaxCall("PUT", usersApi + "/" + user.userId + "/Password", request,
                changePasswordSuccess, changePasswordError);

            return false;
        }

        function changePasswordSuccess(result) {
            $("#currentPassTB").val("");
            $("#newPassTB").val("");

            swal("Saved", "Your password was updated", "success");
        }

        function changePasswordError(err) {
            console.log(err);
            swal("Failed", "The current password is not correct", "error");
        }


        </script>
</head>
<body>

</body>
</html>
