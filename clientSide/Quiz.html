<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Quiz - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;

        let quiz = null;          // the quiz that came from the server
        let currentQuestion = 0;
        let answers = [];
        let timerId = null;
        let secondsLeft = 0;
        let startTime = 0;

        $(document).ready(function () {
            if (!requireLogin()) {
                return;
            }

            user = getLoggedUser();

            buildMenu("quiz");

            $("#capitalQuizBTN").click(function () {
                startQuizFunc("capital");
            });

            $("#flagQuizBTN").click(function () {
                startQuizFunc("flag");
            });

            $("#nextBTN").click(nextQuestionFunc);

            $("#playAgainBTN").click(function () {
                window.location.reload();
            });

            $("#gameDiv").hide();
            $("#resultDiv").hide();

            loadScoresFunc("capital");
        });

       
        function startQuizFunc(quizType) {
            ajaxCall("GET", quizApi + "/Start/" + quizType, null,
                startQuizSuccess, error);
        }

        function startQuizSuccess(quizData) {
            quiz = quizData;
            currentQuestion = 0;
            answers = [];
            startTime = new Date().getTime();

            $("#chooserDiv").hide();
            $("#gameDiv").show();

            let seconds = quiz.timeLimitSeconds;

            if (seconds == null) {
                seconds = 60;
            }

            startTimer(seconds);
            showQuestion();
        }
       
        function startTimer(seconds) {
            secondsLeft = seconds;
            $("#timerPH").html(secondsLeft);
            $("#timerPH").removeClass("danger");

            timerId = setInterval(function () {
                secondsLeft = secondsLeft - 1;
                $("#timerPH").html(secondsLeft);

                if (secondsLeft <= 10) {
                    $("#timerPH").addClass("danger");
                }

                if (secondsLeft <= 0) {
                    clearInterval(timerId);
                    finishQuizFunc(true);
                }
            }, 1000);
        }


        // Questions

        function showQuestion() {
            let question = quiz.questions[currentQuestion];

            $("#progressPH").html(
                "Question " + (currentQuestion + 1) + " of " + quiz.questions.length
            );

            $("#questionPH").html(safeText(question.questionText));

            if (question.imageUrl != null && question.imageUrl != "") {
                $("#imagePH").html(
                    `<img src="${safeText(question.imageUrl)}" height="130" />`
                );
            }
            else {
                $("#imagePH").html("");
            }

            let str = "";

            for (let i = 0; i < question.options.length; i++) {
                str += `
                    <button class="quiz-option" id="option_${i}"
                            onclick="chooseAnswerFunc(${i})">
                        ${safeText(question.options[i])}
                    </button>
                `;
            }

            $("#optionsPH").html(str);
            $("#nextBTN").hide();
        }

        function chooseAnswerFunc(index) {
            let question = quiz.questions[currentQuestion];

            // stop the player from answering twice
            $(".quiz-option").attr("onclick", "");

            answers.push({
                questionId: question.questionId,
                selected: question.options[index]
            });

            $("#option_" + index).addClass("correct");

            $("#nextBTN").show();
        }

        function nextQuestionFunc() {
            currentQuestion = currentQuestion + 1;

            if (currentQuestion >= quiz.questions.length) {
                finishQuizFunc(false);
            }
            else {
                showQuestion();
            }
        } 
        function finishQuizFunc(timeIsOver) {
            clearInterval(timerId);

            let duration = Math.round(
                (new Date().getTime() - startTime) / 1000
            );

            let request = {
                quizType: quiz.quizType,
                userId: user.userId,
                answers: answers,
                durationSeconds: duration
            };

            $("#gameDiv").hide();
            $("#resultDiv").show();

            if (timeIsOver) {
                $("#resultTitlePH").html("Time is over!");
            }
            else {
                $("#resultTitlePH").html("Well done!");
            }

            ajaxCall("POST", quizApi + "/Answer", request, finishQuizSuccess, error);
        }

        function finishQuizSuccess(result) {
            $("#scorePH").html(result.score + " points");

            $("#detailPH").html(
                "You answered " + result.correct +
                " out of " + result.total + " correctly"
            );

            loadScoresFunc(quiz.quizType);
        }

        // High scores

        function loadScoresFunc(quizType) {
            ajaxCall("GET", quizApi + "/Scores/" + quizType, null,
                loadScoresSuccess, scoresError);
        }

        function loadScoresSuccess(scores) {
            if (scores.length == 0) {
                $("#scoresPH").html("<p>There are no results yet</p>");
                return;
            }

            let str = `
                <table class="scores-table">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Score</th>
                        <th>Time</th>
                    </tr>
            `;

            for (let i = 0; i < scores.length; i++) {
                str += `
                    <tr>
                        <td>${i + 1}</td>
                        <td>${safeText(scores[i].fullName)}</td>
                        <td>${scores[i].score}</td>
                        <td>${scores[i].durationSeconds} sec</td>
                    </tr>
                `;
            }

            str += "</table>";

            $("#scoresPH").html(str);
        }

        function scoresError(err) {
            console.log(err);
            $("#scoresPH").html("<p>Could not load the high scores</p>");
        }
        
        </script>
</head>
<body>

</body>
</html>
