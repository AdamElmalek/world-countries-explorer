<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Quiz - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;
        let quizzes = [];
        let currentQuiz = null;
        let currentQuestions = [];
        let attemptId = 0;

        let timerId = null;
        let secondsLeft = 0;
        let attemptStartedAt = 0;
        let quizFinished = false;

        $(document).ready(function () {
            if (!requireLogin()) {
                return;
            }

            user = getLoggedUser();
            buildMenu("quiz");

            $("#submitBTN").click(submitQuizFunc);
            $("#backToQuizzesBTN").click(resetQuizPage);

            loadQuizzesFunc();
            loadPointsFunc();
            loadAttemptsFunc();
        });


        // Active quizzes
        function loadQuizzesFunc() {
            ajaxCall("GET", quizApi, null, loadQuizzesSuccess, error);
        }

        function loadQuizzesSuccess(data) {
            quizzes = data;

            if (quizzes.length == 0) {
                $("#quizzesPH").html("<p>There are no active quizzes.</p>");
                return;
            }

            let str = "";

            for (let i = 0; i < quizzes.length; i++) {
                let quiz = quizzes[i];

                str += `
                        <div class="quiz-card">
                            <h2>${safeText(quiz.title)}</h2>

                            <p>${safeText(quiz.description)}</p>

                            <div>
                                Questions: ${quiz.questionsCount}
                                |
                                Maximum score: ${quiz.maximumScore}
                                |
                                Time: ${quiz.timeLimitSeconds} seconds
                            </div>

                            <button onclick="startQuizFunc(${quiz.quizId})">
                                Start quiz
                            </button>
                        </div>
                    `;
            }

            $("#quizzesPH").html(str);
        }


        // Start quiz
        function startQuizFunc(quizId) {
            currentQuiz = null;

            for (let i = 0; i < quizzes.length; i++) {
                if (quizzes[i].quizId == quizId) {
                    currentQuiz = quizzes[i];
                    break;
                }
            }

            if (currentQuiz == null) {
                swal("Error", "Quiz was not found", "error");
                return;
            }

            swal({
                title: "Start quiz?",
                text: "You will have " + currentQuiz.timeLimitSeconds + " seconds.",
                icon: "info",
                buttons: true
            })
                .then(function (startQuiz) {
                    if (startQuiz) {
                        let url = quizApi + "/" + quizId +
                            "/Start?userId=" + user.userId;

                        ajaxCall("POST", url, null, startAttemptSuccess, error);
                    }
                });
        }

        function startAttemptSuccess(result) {
            attemptId = result;
            attemptStartedAt = Date.now();
            quizFinished = false;

            ajaxCall(
                "GET",
                quizApi + "/" + currentQuiz.quizId + "/Questions",
                null,
                loadQuestionsSuccess,
                error
            );
        }


        // Questions
        function loadQuestionsSuccess(questions) {
            currentQuestions = questions;

            let str = "";

            for (let i = 0; i < questions.length; i++) {
                let question = questions[i];

                str += `
                        <div class="question-card">
                            <h3>
                                ${i + 1}. ${safeText(question.questionText)}
                            </h3>

                            ${createOption(
                    question.questionId,
                    "A",
                    question.optionA
                )}

                            ${createOption(
                    question.questionId,
                    "B",
                    question.optionB
                )}

                            ${createOption(
                    question.questionId,
                    "C",
                    question.optionC
                )}

                            ${createOption(
                    question.questionId,
                    "D",
                    question.optionD
                )}
                        </div>
                    `;
            }

            $("#questionsPH").html(str);
            $("#quizTitlePH").text(currentQuiz.title);

            $("#quizListDiv").hide();
            $("#resultDiv").hide();
            $("#quizAreaDiv").show();

            startTimerFunc();
        }

        function createOption(questionId, optionLetter, optionText) {
            return `
                    <label class="answer-option">
                        <input type="radio"
                               name="question_${questionId}"
                               value="${optionLetter}" />

                        <strong>${optionLetter}.</strong>
                        ${safeText(optionText)}
                    </label>
                `;
        }


        // Timer
        function startTimerFunc() {
            let passedSeconds =
                Math.floor((Date.now() - attemptStartedAt) / 1000);

            secondsLeft =
                currentQuiz.timeLimitSeconds - passedSeconds;

            if (secondsLeft < 0) {
                secondsLeft = 0;
            }

            showTimer();

            timerId = setInterval(function () {
                secondsLeft--;
                showTimer();

                if (secondsLeft <= 0) {
                    clearInterval(timerId);
                    submitQuizRequest();
                }
            }, 1000);
        }

        function showTimer() {
            $("#timerPH").text("Time left: " + secondsLeft + " seconds");

            if (secondsLeft <= 10) {
                $("#timerPH").addClass("timer-warning");
            }
            else {
                $("#timerPH").removeClass("timer-warning");
            }
        }


        // Submit quiz
        function submitQuizFunc() {
            if (quizFinished) {
                return;
            }

            let answers = collectAnswers();

            if (answers.length < currentQuestions.length) {
                swal({
                    title: "Some questions are unanswered",
                    text: "Do you still want to submit?",
                    icon: "warning",
                    buttons: true
                })
                    .then(function (submitQuiz) {
                        if (submitQuiz) {
                            submitQuizRequest();
                        }
                    });

                return;
            }

            submitQuizRequest();
        }

        function collectAnswers() {
            let answers = [];

            for (let i = 0; i < currentQuestions.length; i++) {
                let question = currentQuestions[i];

                let selectedOption = $(
                    "input[name='question_" +
                    question.questionId +
                    "']:checked"
                ).val();

                if (selectedOption != null) {
                    answers.push({
                        questionId: question.questionId,
                        selectedOption: selectedOption
                    });
                }
            }

            return answers;
        }

        function submitQuizRequest() {
            if (quizFinished) {
                return;
            }

            quizFinished = true;
            clearInterval(timerId);
            $("#submitBTN").prop("disabled", true);

            let request = {
                attemptId: attemptId,
                userId: user.userId,
                quizId: currentQuiz.quizId,
                answers: collectAnswers()
            };

            ajaxCall(
                "POST",
                quizApi + "/Submit",
                request,
                submitQuizSuccess,
                submitQuizError
            );
        }

        function submitQuizSuccess(result) {
            $("#quizAreaDiv").hide();
            $("#resultDiv").show();

            let message = "";

            if (result.timeExpired) {
                message = `
                        <h2>Time expired</h2>
                        <p>Your quiz was submitted after the time limit.</p>
                    `;
            }
            else {
                message = `
                        <h2>Quiz completed</h2>

                        <p>
                            Correct answers:
                            <strong>
                                ${result.correctAnswers} /
                                ${result.totalQuestions}
                            </strong>
                        </p>

                        <p>
                            Score:
                            <strong>${result.score}</strong>
                        </p>
                    `;
            }

            message += `
                    <p>
                        Your total quiz points:
                        <strong>${result.totalPoints}</strong>
                    </p>
                `;

            $("#resultPH").html(message);

            loadPointsFunc();
            loadAttemptsFunc();
        }

        function submitQuizError(err) {
            quizFinished = false;
            $("#submitBTN").prop("disabled", false);
            error(err);
        }


        // Points and history
        function loadPointsFunc() {
            ajaxCall(
                "GET",
                quizApi + "/User/" + user.userId + "/Points",
                null,
                function (points) {
                    $("#pointsPH").text(points);
                },
                error
            );
        }

        function loadAttemptsFunc() {
            ajaxCall(
                "GET",
                quizApi + "/User/" + user.userId + "/Attempts",
                null,
                loadAttemptsSuccess,
                error
            );
        }

        function loadAttemptsSuccess(attempts) {
            if (attempts.length == 0) {
                $("#attemptsPH").html(
                    "<p>You have not completed a quiz yet.</p>"
                );

                return;
            }

            let str = `
                    <table class="attempts-table">
                        <thead>
                            <tr>
                                <th>Quiz</th>
                                <th>Score</th>
                                <th>Correct answers</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

            for (let i = 0; i < attempts.length; i++) {
                let attempt = attempts[i];

                let dateText = "Not completed";

                if (attempt.isCompleted) {
                    dateText = new Date(
                        attempt.finishedAt
                    ).toLocaleString();
                }

                str += `
                        <tr>
                            <td>${safeText(attempt.title)}</td>
                            <td>${attempt.score}</td>
                            <td>
                                ${attempt.correctAnswers} /
                                ${attempt.totalQuestions}
                            </td>
                            <td>${safeText(dateText)}</td>
                        </tr>
                    `;
            }

            str += "</tbody></table>";

            $("#attemptsPH").html(str);
        }


        // Return to quiz list
        function resetQuizPage() {
            clearInterval(timerId);

            currentQuiz = null;
            currentQuestions = [];
            attemptId = 0;
            quizFinished = false;

            $("#submitBTN").prop("disabled", false);
            $("#timerPH").removeClass("timer-warning");

            $("#resultDiv").hide();
            $("#quizAreaDiv").hide();
            $("#quizListDiv").show();
        }
    </script>

    <style>
        .quiz-card,
        .question-card {
            background: white;
            padding: 18px;
            margin-bottom: 14px;
            border-radius: 8px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, 0.08);
        }

            .quiz-card button {
                margin-top: 12px;
            }

        .answer-option {
            display: block;
            padding: 10px;
            margin: 7px 0;
            border: 1px solid #d8e0eb;
            border-radius: 6px;
            cursor: pointer;
        }

            .answer-option:hover {
                background: #eef4ff;
            }

        #timerPH {
            font-size: 20px;
            font-weight: bold;
            color: #1f4e79;
            margin-bottom: 15px;
        }

        .timer-warning {
            color: #c0392b !important;
        }

        .attempts-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

            .attempts-table th,
            .attempts-table td {
                padding: 10px;
                text-align: left;
                border-bottom: 1px solid #ddd;
            }

            .attempts-table th {
                background: #eaf0f8;
            }

        #quizAreaDiv,
        #resultDiv {
            display: none;
        }
    </style>
</head>

<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>Country Quizzes</h1>

        <div class="card-box">
            Your total quiz points:
            <strong id="pointsPH">0</strong>
        </div>

        <div id="quizListDiv">
            <h2>Available quizzes</h2>
            <div id="quizzesPH"></div>
        </div>

        <div id="quizAreaDiv">
            <h2 id="quizTitlePH"></h2>

            <div id="timerPH"></div>
            <div id="questionsPH"></div>

            <input type="button"
                   id="submitBTN"
                   value="Submit quiz" />
        </div>

        <div id="resultDiv" class="card-box">
            <div id="resultPH"></div>

            <input type="button"
                   id="backToQuizzesBTN"
                   value="Back to quizzes" />
        </div>

        <h2>My quiz history</h2>
        <div id="attemptsPH"></div>
    </div>
</body>
</html>
