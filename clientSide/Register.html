<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Register - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>
    <script>
        $(document).ready(function () {
            $("#registerForm").submit(registerFunc);

            $("#loginLink").click(function () {
                window.location.href = "Login.html";
            });

            // checks that the two passwords are the same
            $("#passTB, #confirmTB").on("input", checkPasswordsMatch);
        });

        function checkPasswordsMatch() {
            let pass = $("#passTB").val();
            let confirm = $("#confirmTB").val();

            if (pass != confirm) {
                document.getElementById("confirmTB")
                    .setCustomValidity("Passwords do not match");
            }
            else {
                document.getElementById("confirmTB")
                    .setCustomValidity("");
            }
        }

        function registerFunc() {
            let user = {
                userId: 0,
                fullName: $("#nameTB").val().trim(),
                email: $("#emailTB").val().trim().toLowerCase(),
                password: $("#passTB").val(),
                passwordHash: "",
                role: "User",
                isLocked: false,
                canShare: true
            };

            $("#msgPH").html("");

            ajaxCall("POST", usersApi + "/Register", user, registerSuccess, registerError);

            return false;
        }
        function registerSuccess(newUserId) {
            swal("Registered", "Your account was created. Please log in.", "success");

            window.location.href = "Login.html";
        }

        function registerError(err) {
            console.log(err);

            // 409 = the email is already registered
            if (err.status == 409) {
                $("#msgPH").html("This email is already registered");
            }
            else {
                $("#msgPH").html("Registration failed. Please check your details.");
            }
        }
    </script>

</head >
<body>
    <div class="page">
        <div id="menuPH"></div>

        <div class="form-box">
            <h1>Register</h1>

            <form id="registerForm">
                <input id="nameTB"
                       type="text"
                       placeholder="Full name"
                       required
                       minlength="2"
                       maxlength="100" />

                <input id="emailTB"
                       type="email"
                       placeholder="Email"
                       required
                       maxlength="255" />

                <!-- at least one capital letter and one digit, 6 characters or more -->
                <input id="passTB"
                       type="password"
                       placeholder="Password"
                       required
                       minlength="6"
                       pattern="(?=.*[A-Z])(?=.*[0-9]).{6,}"
                       title="At least 6 characters, one capital letter and one digit" />

                <input id="confirmTB"
                       type="password"
                       placeholder="Confirm password"
                       required />

                <input type="submit" value="Register" />
            </form>

            <p id="msgPH" class="error"></p>

            <p>
                Already registered?
                <a href="#" id="loginLink">Login here</a>
            </p>
        </div>
    </div>

</body>
</html >
