<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Lists - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;
        let currentTab = "Visited";

        $(document).ready(function () {
            if (!requireLogin()) {
                return;
            }

            user = getLoggedUser();
            buildMenu("lists");

            $("#visitedTabBTN").click(function () {
                showTab("Visited");
            });

            $("#wantTabBTN").click(function () {
                showTab("WantToVisit");
            });

            reloadBothLists();
            showTab("Visited");
        });

        function showTab(listType) {
            currentTab = listType;

            if (listType == "Visited") {
                $("#visitedPH").show();
                $("#wantPH").hide();
                $("#visitedTabBTN").addClass("active-tab");
                $("#wantTabBTN").removeClass("active-tab");
            }
            else {
                $("#visitedPH").hide();
                $("#wantPH").show();
                $("#visitedTabBTN").removeClass("active-tab");
                $("#wantTabBTN").addClass("active-tab");
            }
        }

        // =====================================================
        // Load lists
        // =====================================================

        function loadListFunc(listType) {
            let api = listsApi + "/" + user.userId + "/" + listType;

            ajaxCall("GET", api, null, function (items) {
                renderList(items, listType);
            }, error);
        }

        function renderList(items, listType) {
            let placeHolder = listType == "Visited" ? "#visitedPH" : "#wantPH";
            let countPH = listType == "Visited" ? "#visitedCountPH" : "#wantCountPH";

            $(countPH).html("(" + items.length + ")");

            if (items.length == 0) {
                $(placeHolder).html("<p>This list is empty. Add countries from the country page.</p>");
                return;
            }

            let otherType = listType == "Visited" ? "WantToVisit" : "Visited";
            let otherLabel = listType == "Visited" ? "Move to Want to visit" : "Move to Visited";
            let str = "";

            for (let i = 0; i < items.length; i++) {
                let item = items[i];
                let country = item.country;

                str += `
                            <div class="share-card">
                                <div class="list-row">
                                    <img src="${safeText(country.flagUrl)}"
                                         alt="Flag of ${safeText(country.name)}" width="70" />

                                    <div class="list-info">
                                        <a href="country.html?id=${country.countryId}">
                                            <strong>${safeText(country.name)}</strong>
                                        </a>

                                        <div class="country-small-info">
                                            ${safeText(country.capital)} - ${safeText(country.region)}
                                        </div>

                                        <div class="saved-date">
                                            Saved: ${formatSavedDate(item.savedAt)}
                                        </div>
                                    </div>

                                    <button onclick="moveCountryFunc(${country.countryId}, '${otherType}')">
                                        ${otherLabel}
                                    </button>

                                    <button class="delete-btn" onclick="removeCountryFunc(${country.countryId})">
                                        Remove
                                    </button>
                                </div>
                            </div>
                        `;
            }

            $(placeHolder).html(str);
        }

        function formatSavedDate(savedAt) {
            if (savedAt == null || savedAt == "") {
                return "";
            }

            return new Date(savedAt).toLocaleDateString();
        }

        // =====================================================
        // Move and remove
        // =====================================================

        function moveCountryFunc(countryId, toType) {
            let request = {
                listType: toType
            };

            let api = listsApi + "/" + user.userId + "/" + countryId;
            ajaxCall("PUT", api, request, moveCountrySuccess, error);
        }

        function moveCountrySuccess() {
            swal("Moved", "The country was moved to the other list", "success");
            reloadBothLists();
        }

        function removeCountryFunc(countryId) {
            swal({
                title: "Remove this country?",
                icon: "warning",
                buttons: true,
                dangerMode: true
            })
                .then(function (willRemove) {
                    if (willRemove) {
                        let api = listsApi + "/" + user.userId + "/" + countryId;
                        ajaxCall("DELETE", api, null, removeCountrySuccess, error);
                    }
                });
        }

        function removeCountrySuccess() {
            swal("Removed", "The country was removed from your list", "success");
            reloadBothLists();
        }

        function reloadBothLists() {
            loadListFunc("Visited");
            loadListFunc("WantToVisit");
            showTab(currentTab);
        }
    </script>

    <style>
        .list-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

            .list-row img {
                max-height: 50px;
                object-fit: cover;
                border: 1px solid #ddd;
            }

        .list-info {
            flex-grow: 1;
            min-width: 180px;
        }

        .country-small-info {
            margin-top: 5px;
            color: #555;
        }

        .saved-date {
            margin-top: 4px;
            font-size: 13px;
            color: #777;
        }

        .tab-buttons {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .active-tab {
            font-weight: bold;
            border: 2px solid #1f4e79;
        }
    </style>
</head>

<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>My Lists</h1>

        <div class="tab-buttons">
            <input type="button" id="visitedTabBTN" value="Visited" />
            <span id="visitedCountPH"></span>

            <input type="button" id="wantTabBTN" value="Want to visit" />
            <span id="wantCountPH"></span>
        </div>

        <div id="visitedPH"></div>
        <div id="wantPH"></div>
    </div>
</body>
</html>
