<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Lists - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;

        $(document).ready(function () {
            if (!requireLogin()) {
                return;
            }

            user = getLoggedUser();

            buildMenu("lists");

            $("#visitedTabBTN").click(function () {
                showTab("Visited");
            });

            $("#wantTabBTN").click(function () {
                showTab("WantToVisit");
            });

            loadListFunc("Visited");
            loadListFunc("WantToVisit");

            showTab("Visited");
        });
</script>
