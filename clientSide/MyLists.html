<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>My Lists - World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;

        $(document).ready(function () {
            if (!requireLogin()) {
                return;
            }

            user = getLoggedUser();

            buildMenu("lists");

            $("#visitedTabBTN").click(function () {
                showTab("Visited");
            });

            $("#wantTabBTN").click(function () {
                showTab("WantToVisit");
            });

            loadListFunc("Visited");
            loadListFunc("WantToVisit");

            showTab("Visited");
        });

        function showTab(listType) {
            if (listType == "Visited") {
                $("#visitedPH").show();
                $("#wantPH").hide();
            }
            else {
                $("#visitedPH").hide();
                $("#wantPH").show();
            }
        }

        // Load a list

        function loadListFunc(listType) {
            ajaxCall("GET",
                listsApi + "/" + listType + "?userId=" + user.userId,
                null,
                function (countries) {
                    renderList(countries, listType);
                },
                error);
        }

        function renderList(countries, listType) {
            let placeHolder = (listType == "Visited") ? "#visitedPH" : "#wantPH";
            let countPH = (listType == "Visited") ? "#visitedCountPH" : "#wantCountPH";

            $(countPH).html("(" + countries.length + ")");

            if (countries.length == 0) {
                $(placeHolder).html("<p>This list is empty. Add countries from the country page.</p>");
                return;
            }

            // the other list, used by the move button
            let otherType = (listType == "Visited") ? "WantToVisit" : "Visited";
            let otherLabel = (listType == "Visited") ? "Move to Want to visit" : "Move to Visited";

            let str = "";

            for (let i = 0; i < countries.length; i++) {
                let country = countries[i];

                str += `
                        <div class="share-card">
                            <div class="list-row">
                                <img src="${safeText(country.flagUrl)}" width="60" />

                                <div class="list-info">
                                    <a href="country.html?id=${country.countryId}">
                                        <strong>${safeText(country.name)}</strong>
                                    </a>
                                    <div class="share-head">
                                        ${safeText(country.capital)} - ${safeText(country.region)}
                                    </div>
                                </div>

                                <button onclick="moveCountryFunc(${country.countryId}, '${listType}', '${otherType}')">
                                    ${otherLabel}
                                </button>

                                <button class="delete-btn"
                                        onclick="removeCountryFunc(${country.countryId}, '${listType}')">
                                    Remove
                                </button>
                            </div>
                        </div>
                    `;
            }

            $(placeHolder).html(str);
        }


        // Move and remove

        function moveCountryFunc(countryId, fromType, toType) {
            let request = {
                userId: user.userId,
                countryId: countryId,
                fromType: fromType,
                toType: toType
            };

            ajaxCall("PUT", listsApi + "/Move", request, reloadBothLists, error);
        }

        function removeCountryFunc(countryId, listType) {
            swal({
                title: "Remove this country?",
                icon: "warning",
                buttons: true,
                dangerMode: true
            })
                .then(function (willRemove) {
                    if (willRemove) {
                        ajaxCall("DELETE",
                            listsApi + "?userId=" + user.userId +
                            "&countryId=" + countryId +
                            "&listType=" + listType,
                            null, reloadBothLists, error);
                    }
                });
        }

        function reloadBothLists(result) {
            loadListFunc("Visited");
            loadListFunc("WantToVisit");
        }

    </script>

    <style>
        .list-row {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .list-info {
            flex-grow: 1;
        }

        .tab-buttons {
            margin-bottom: 15px;
        }
    </style>
</head>


<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>My Lists</h1>

        <div class="tab-buttons">
            <input type="button" id="visitedTabBTN" value="Visited" />
            <span id="visitedCountPH"></span>

            <input type="button" id="wantTabBTN" value="Want to visit" />
            <span id="wantCountPH"></span>
        </div>

        <div id="visitedPH"></div>
        <div id="wantPH"></div>
    </div>
</body>
</html>
