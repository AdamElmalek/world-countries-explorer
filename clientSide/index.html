<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>World Countries</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.19/css/jquery.dataTables.min.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.19/js/jquery.dataTables.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>
    <script>
        let countries = [];
        let tbl = null;
        let tableMode = false;

        $(document).ready(function () {
            buildMenu("countries");

            $("#searchBTN").click(loadCountriesFunc);
            $("#clearBTN").click(clearFiltersFunc);
            $("#toggleViewBTN").click(toggleViewFunc);

            // search while typing
            $("#searchTB").on("input", loadCountriesFunc);
            $("#regionDD, #sortByDD, #dirDD").change(loadCountriesFunc);

            $("#tableDiv").hide();

            loadFilterOptionsFunc();
            loadCountriesFunc();
        });


        // Filter options for the dropdowns
        function loadFilterOptionsFunc() {
            ajaxCall("GET", countriesApi + "/FilterOptions", null,
                loadFilterOptionsSuccess, filterOptionsError);
        }

        function loadFilterOptionsSuccess(options) {
            let str = "<option value=''>All regions</option>";

            for (let i = 0; i < options.regions.length; i++) {
                str += `<option value="${options.regions[i]}">${options.regions[i]}</option>`;
            }

            $("#regionDD").html(str);
        }

        function filterOptionsError(err) {
            // the page still works without the dropdown values
            console.log(err);
        }

        // =====================================================
        // Load countries
        // =====================================================

        function loadCountriesFunc() {
            let query = "?search=" + encodeURIComponent($("#searchTB").val().trim()) +
                "&region=" + encodeURIComponent($("#regionDD").val()) +
                "&sortBy=" + $("#sortByDD").val() +
                "&dir=" + $("#dirDD").val();

            ajaxCall("GET", countriesApi + query, null, getCountriesSuccess, error);
        }

        function getCountriesSuccess(countriesData) {
            countries = countriesData;

            $("#countPH").html("Found " + countries.length + " countries");

            renderCards(countries);
            buildDataTable(countries);
        }

        function renderCards(countriesData) {
            if (countriesData.length == 0) {
                $("#cardsPH").html("<h3>No countries were found</h3>");
                return;
            }

            let str = "";

            for (let i = 0; i < countriesData.length; i++) {
                let country = countriesData[i];

                str += `
                    <div class="country-card">
                        <img src="${safeText(country.flagUrl)}" alt="Flag of ${safeText(country.name)}" />

                        <div class="card-body">
                            <h3>${safeText(country.name)}</h3>
                            <p>Capital: ${safeText(country.capital)}</p>
                            <p>Region: ${safeText(country.region)}</p>
                            <p>Population: ${formatNumber(country.population)}</p>

                            <button onclick="openCountryFunc(${country.countryId})">
                                View details
                            </button>
                        </div>
                    </div>
                `;
            }

            $("#cardsPH").html(str);
        }

        function openCountryFunc(countryId) {
            window.location.href = "country.html?id=" + countryId;
        }

        // Table view (DataTables)
        function buildDataTable(countriesData) {
            if (tbl != null) {
                tbl.destroy();
                $("#countriesTable tbody").empty();
            }

            tbl = $("#countriesTable").DataTable({
                data: countriesData,
                pageLength: 10,
                columns: [
                    {
                        data: "flagUrl",
                        render: function (data) {
                            return `<img src="${data}" width="50" />`;
                        }
                    },
                    { data: "name" },
                    { data: "capital" },
                    { data: "region" },
                    {
                        data: "population",
                        render: function (data) {
                            return formatNumber(data);
                        }
                    },
                    {
                        data: "area",
                        render: function (data) {
                            return formatNumber(data);
                        }
                    },
                    {
                        data: "countryId",
                        render: function (data) {
                            return `<button onclick="openCountryFunc(${data})">Details</button>`;
                        }
                    }
                ]
            });
        }

        function toggleViewFunc() {
            tableMode = !tableMode;

            if (tableMode) {
                $("#cardsPH").hide();
                $("#tableDiv").show();
                $("#toggleViewBTN").val("Cards View");
            }
            else {
                $("#tableDiv").hide();
                $("#cardsPH").show();
                $("#toggleViewBTN").val("Table View");
            }
        }
        </script>
</head >
            <body>

            </body>
</html >
