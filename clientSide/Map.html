<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Map - World Countries</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;
        let map = null;
        let markersLayer = null;

        let countries = [];
        let listOfCountry = {};   // countryId -> Visited / WantToVisit

        const COLORS = {
            Visited: "#2e7d32",
            WantToVisit: "#1565c0",
            none: "#8a97a8"
        };

        $(document).ready(function () {
            buildMenu("map");

            user = getLoggedUser();

            initMap();

            $("#regionDD").change(drawMarkers);

            loadCountriesFunc();
        });

        function initMap() {
            map = L.map("mapDiv").setView([25, 15], 2);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "&copy; OpenStreetMap contributors",
                maxZoom: 10
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
        }


        // Load the data
        function loadCountriesFunc() {
            ajaxCall("GET", countriesApi, null, loadCountriesSuccess, error);
        }

        function loadCountriesSuccess(countriesData) {
            countries = countriesData;

            fillRegionDropDown();

            // a logged-in user also sees his own lists on the map
            if (isLoggedIn()) {
                loadListFunc("Visited");
            }
            else {
                drawMarkers();
            }
        }

        function loadListFunc(listType) {
            ajaxCall("GET",
                listsApi + "/" + listType + "?userId=" + user.userId,
                null,
                function (list) {
                    for (let i = 0; i < list.length; i++) {
                        listOfCountry[list[i].countryId] = listType;
                    }

                    if (listType == "Visited") {
                        // now load the second list
                        loadListFunc("WantToVisit");
                    }
                    else {
                        drawMarkers();
                    }
                },
                function (err) {
                    console.log(err);
                    drawMarkers();
                });
        }


        </script>
</head>
<body>

</body>
</html>
