<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Map - World Countries</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="ajaxCalls.js"></script>
    <script src="common.js"></script>

    <script>
        let user = null;
        let map = null;
        let markersLayer = null;

        let countries = [];
        let listOfCountry = {};   // countryId -> Visited / WantToVisit

        const COLORS = {
            Visited: "#2e7d32",
            WantToVisit: "#1565c0",
            none: "#8a97a8"
        };

        $(document).ready(function () {
            buildMenu("map");

            user = getLoggedUser();

            initMap();

            $("#regionDD").change(drawMarkers);

            loadCountriesFunc();
        });

        function initMap() {
            map = L.map("mapDiv").setView([25, 15], 2);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: "&copy; OpenStreetMap contributors",
                maxZoom: 10
            }).addTo(map);

            markersLayer = L.layerGroup().addTo(map);
        }


        // Load the data
        function loadCountriesFunc() {
            ajaxCall("GET", countriesApi, null, loadCountriesSuccess, error);
        }

        function loadCountriesSuccess(countriesData) {
            countries = countriesData;

            fillRegionDropDown();

            // a logged-in user also sees his own lists on the map
            if (isLoggedIn()) {
                loadListFunc("Visited");
            }
            else {
                drawMarkers();
            }
        }

        function loadListFunc(listType) {
            ajaxCall("GET",
                listsApi + "/" + listType + "?userId=" + user.userId,
                null,
                function (list) {
                    for (let i = 0; i < list.length; i++) {
                        listOfCountry[list[i].countryId] = listType;
                    }

                    if (listType == "Visited") {
                        // now load the second list
                        loadListFunc("WantToVisit");
                    }
                    else {
                        drawMarkers();
                    }
                },
                function (err) {
                    console.log(err);
                    drawMarkers();
                });
        }

        function fillRegionDropDown() {
            let regions = [];

            for (let i = 0; i < countries.length; i++) {
                if (!regions.includes(countries[i].region)) {
                    regions.push(countries[i].region);
                }
            }

            regions.sort();

            let str = "<option value=''>All regions</option>";

            for (let i = 0; i < regions.length; i++) {
                str += `<option value="${regions[i]}">${regions[i]}</option>`;
            }

            $("#regionDD").html(str);
        }

        // Draw

        function drawMarkers() {
            let region = $("#regionDD").val();

            markersLayer.clearLayers();

            let shown = 0;

            for (let i = 0; i < countries.length; i++) {
                let country = countries[i];

                if (region != "" && country.region != region) {
                    continue;
                }

                // a country without coordinates cannot be drawn
                if (country.lat == null || country.lng == null) {
                    continue;
                }

                let listType = listOfCountry[country.countryId];

                if (listType == null) {
                    listType = "none";
                }

                let marker = L.circleMarker([country.lat, country.lng], {
                    radius: (listType == "none") ? 6 : 9,
                    color: "#ffffff",
                    weight: 2,
                    fillColor: COLORS[listType],
                    fillOpacity: 0.95
                });

                marker.bindPopup(`
                    <div style="min-width:150px">
                        <img src="${country.flagUrl}" width="60" /><br />
                        <strong>${country.name}</strong><br />
                        Capital: ${country.capital}<br />
                        Population: ${formatNumber(country.population)}<br />
                        <a href="country.html?id=${country.countryId}">View details</a>
                    </div>
                `);

                marker.addTo(markersLayer);

                shown = shown + 1;
            }

            $("#countPH").html("Showing " + shown + " countries on the map");
        }
        </script>
</head>
<body>
    <div class="page">
        <div id="menuPH"></div>

        <h1>Interactive Map</h1>

        <div class="controls">
            <span><span class="legend-dot" style="background:#2e7d32"></span> Visited</span>
            <span><span class="legend-dot" style="background:#1565c0"></span> Want to visit</span>
            <span><span class="legend-dot" style="background:#8a97a8"></span> Other countries</span>

            <select id="regionDD">
                <option value="">All regions</option>
            </select>
        </div>

        <p id="countPH"></p>

        <div id="mapDiv"></div>

        <p class="share-head">
            The coordinates come from the database and are saved when the
            countries are imported on the server side.
        </p>
    </div>
</body>
</html>
